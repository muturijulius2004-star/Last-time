<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    background: #f2f5fa;
    color: #253247;
}

header {
    background: #123d70;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 { font-size: 27px; margin-bottom: 8px; }
header p { font-size: 14px; color: #dceaff; }

.account-bar {
    max-width: 650px;
    margin: 15px auto;
    padding: 0 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    color: #536174;
    font-size: 13px;
}

.logout {
    background: #e4eaf2;
    color: #253d5b;
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container { max-width: 650px; margin: 25px auto; padding: 0 15px; }

.page {
    display: none;
    background: white;
    padding: 30px 22px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
    min-height: 390px;
}

.page.active { display: block; }

.page h2 { color: #123d70; margin-bottom: 18px; font-size: 25px; }

.page p {
    line-height: 1.7;
    margin-bottom: 15px;
    color: #536174;
}

.hero {
    background: #e8f1ff;
    padding: 30px 15px;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 20px;
}

.hero h2 { font-size: 28px; }

.feature {
    background: #f4f7fc;
    padding: 15px;
    margin: 12px 0;
    border-radius: 8px;
    border-left: 4px solid #246dc0;
}

label {
    display: block;
    margin: 17px 0 8px;
    font-weight: bold;
    color: #253d5b;
}

input, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd4df;
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
}

input:focus, textarea:focus { outline: none; border-color: #246dc0; }

textarea { resize: vertical; min-height: 125px; }

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 30px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.next { background: #1769bb; color: white; margin-left: auto; }
.back { background: #e4eaf2; color: #253d5b; }
.submit { background: #16834b; color: white; width: 100%; margin-top: 22px; }

button:hover { opacity: .88; }
button:disabled { opacity: .6; cursor: wait; }

.progress {
    text-align: center;
    color: #64748b;
    margin-top: 20px;
    font-size: 13px;
}

.success {
    display: none;
    text-align: center;
    background: #e8f8ef;
    padding: 22px;
    border-radius: 9px;
    margin-top: 20px;
    color: #176b3c;
}

.form-error {
    display: none;
    background: #fff0f0;
    color: #b42318;
    padding: 13px;
    border-radius: 7px;
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #748094;
    font-size: 13px;
}

@media(max-width:480px) {
    .page { padding: 23px 17px; }
    .page h2 { font-size: 22px; }
    header h1 { font-size: 23px; }
}
  </style>
